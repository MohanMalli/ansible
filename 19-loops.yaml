 - name: install packages
   hosts: frontend
   become: yes
   tasks:
    - name: Installing packages and removing unused packages
      ansible.builtin.package:
       name: "{item.name}"
       state: "{item.state}"
   loop:
    - {name: 'nginx', state: 'absent'}
    - {name: 'mysql', state: 'present'}
    - {name: 'zip', state: 'absent'}    